<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora AI Caddy</title>

    <link rel="stylesheet" href="GolfCaddyV2.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>RoraAI CADDY</h1>

</div>

<!-- GAME STATUS -->
<div class="card">
    <h2> Game Status</h2>
    <p>Hole: 3</p>
    <p>Distance: 145 yards</p>
    <p>Strokes left: 4</p>
</div>

<!-- CLUB -->
<div class="card">
    <h2>️ Club Recommendation</h2>
    <p>Suggested Club: 7 Iron</p>
    <p>Reason: Medium distance + wind</p>
</div>

<!-- WIND -->
<div class="card">
    <h2> Wind Conditions</h2>
    <p>Wind: 10 mph</p>
    <p>Tip: Aim slightly left</p>
</div>

<!-- STROKES -->
<div class="card">
    <h2> Stroke Tracker</h2>
    <button>+ Add Stroke</button>
    <button>- Remove Stroke</button>
</div>

<!-- SCORECARD -->
<div class="card">
    <h2> Scorecard</h2>
    <p>Hole 1: 4</p>
    <p>Hole 2: 5</p>
    <p>Hole 3: 3</p>
</div>

</body>

</html>
