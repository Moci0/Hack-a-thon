<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
    <title>Home - Tech Shop</title>
    <link href="https://fonts.googleapis.com/css?family=Heebo:300,400,700&display=swap" rel = "stylesheet">
    <link rel="stylesheet" href="GolfCaddy.css">
</head>

<body>

<div class = "title-container">
    <div class = "RoraAI">
        <p>Welcome to RorAI Caddy</p>
    </div>
</div>
</body>
</html>


<div class="dashboard">

    <!-- BLOCK 1: STATUS -->
    <div class="block">
        <h3>RorAI Caddy</h3>
        <div class="content">
            <p>Hole: 3</p>
            <p>Distance: 145 yards</p>
            <p>Strokes left: 4</p>
        </div>
    </div>

    <!-- BLOCK 2: CLUB RECOMMENDATION -->
    <div class="block">
        <h3>Club Recommendation</h3>
        <div class="content">
            <p>Use: 7 Iron</p>
            <p>Reason: Medium distance + wind resistance</p>
        </div>
    </div>

    <!-- BLOCK 3: WIND CONDITIONS -->
    <div class="block">
        <h3>Conditions</h3>
        <div class="content">
            <p>Wind: 10 mph</p>
            <p>Advice: Aim slightly left</p>
        </div>
    </div>

    <!-- BLOCK 4: STROKES -->
    <div class="block">
        <h3>Stroke Tracker</h3>
        <div class="content">
            <p>Current strokes: 2</p>

            <button>+ Add Stroke</button>
            <button>- Remove Stroke</button>
        </div>
    </div>

    <!-- BLOCK 5: SCORECARD -->
    <div class="block">
        <h3>Scorecard</h3>
        <div class="content">
            <p>Hole 1: 4</p>
            <p>Hole 2: 5</p>
            <p>Hole 3: 3</p>
        </div>
    </div>

</div>
